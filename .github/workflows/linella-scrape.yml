name: Linella scrape

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1,3,5"
      timezone: "Europe/Chisinau"

permissions:
  contents: write

concurrency:
  group: retail-scrape-commit
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-linella.txt

      - name: Install dependencies
        run: pip install -r requirements-linella.txt

      - name: Scrape Linella
        run: python linella_scraper.py

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Linella/linella_scrape_*.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update Linella $(TZ=Europe/Chisinau date +%Y%m%d)"
          git pull --rebase origin main
          git push
